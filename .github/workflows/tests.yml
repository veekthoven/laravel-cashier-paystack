name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            testbench: '8.*'
            laravel: '10'
          - php: '8.2'
            testbench: '9.*'
            laravel: '11'
          - php: '8.3'
            testbench: '10.*'
            laravel: '12'
          - php: '8.4'
            testbench: '11.*'
            laravel: '13'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --with "orchestra/testbench:${{ matrix.testbench }}" --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
